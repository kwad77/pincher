name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - label: ubuntu-latest
            os: ubuntu-latest
            packages: ./...
            build_pinch: true
            coverage: true
            # 240s after v0.67 #1231 schema v28 rebuild — same as macos.
            # cmd/pinch crosses 120s on the GHA runner once the
            # symbols-table rebuild migration runs N times across the
            # subprocess-coverage tests. Local runs are ~75s.
            #
            # Cap per-package test parallelism at 4. internal/server is
            # SQLite-heavy and regresses under the default high
            # parallelism: local full-suite wall time dropped from ~75s to
            # ~49s with this cap while keeping package-level concurrency.
            test-flags: -timeout 240s -parallel 4
          - label: macos-latest
            os: macos-latest
            packages: ./...
            build_pinch: true
            coverage: false
            # 240s after v0.67 #1231 schema v28 rebuild — cmd/pinch
            # crossed the 120s budget on the macos-latest runner once
            # the symbols-table rebuild migration landed. Local runs
            # are ~75s; the slower runner needs the headroom.
            #
            # Match Ubuntu's per-package parallel cap to avoid
            # SQLite-heavy internal/server contention on shared runners.
            test-flags: -timeout 240s -parallel 4
          - label: windows-latest / cli
            os: windows-latest
            packages: ./cmd/pinch ./cmd/benchcmp ./cmd/closurebench ./cmd/tracelatencybench ./cmd/workflow-lint
            build_pinch: true
            coverage: false
            # Windows is the PR wall-clock bottleneck: setup-go cache
            # restore is ~30s, then `go test ./... -p 2` spends ~7m in
            # serial package work. Shard the Windows packages so the
            # slow cmd/pinch subprocess suite runs in parallel with the
            # slow SQLite-heavy internal packages on separate runners.
            test-flags: -timeout 600s -p 2
          - label: windows-latest / server
            os: windows-latest
            packages: ./internal/server
            build_pinch: false
            coverage: false
            # Server dominates the data shard on Windows. Keep it on
            # its own runner so db/index no longer serialize behind or
            # in front of the longest package.
            # Cap per-package test parallelism for the same reason as
            # Linux/macOS: this package gets slower when too many
            # SQLite-backed tests run at once.
            test-flags: -timeout 600s -p 2 -parallel 4
          - label: windows-latest / index
            os: windows-latest
            packages: ./internal/index
            build_pinch: false
            coverage: false
            # After v0.97.2, the combined index-db shard was the CI
            # tail: setup-go restored a 331MB Windows cache, then
            # internal/index took ~190s and internal/db ~135s. Split
            # them so both packages run beside each other instead of
            # sharing one runner (#1909).
            test-flags: -timeout 600s
          - label: windows-latest / db
            os: windows-latest
            packages: ./internal/db
            build_pinch: false
            coverage: false
            # See windows-latest / index above; this duplicate runner
            # cost is intentional while Windows index/db are the wall
            # clock tail.
            test-flags: -timeout 600s
          - label: windows-latest / core
            os: windows-latest
            packages: ./internal/ast ./internal/cypher ./internal/init ./internal/supervisor ./internal/supervisor/cmd/probe
            build_pinch: false
            coverage: false
            # Windows SQLite I/O is ~10x slower per package. Was -p 1
            # (full serial); trying -p 2 — tests use unique temp dirs
            # so concurrent packages shouldn't contend on SQLite, and
            # the non-DB core packages are light enough to share one
            # shard rather than each paying its own setup-go cost.
            #
            # #770: -timeout is per-package. The process-spawn-heavy
            # packages (cmd/pinch, internal/supervisor/cmd/probe) run
            # real `pincher` child processes serially; under -p 2 they
            # contend with a concurrent package for the runner's CPU
            # headroom and cmd/pinch tripped the 300s per-package
            # deadline (`panic: test timed out after 5m0s`) 3x in one
            # session. 600s absorbs the contention slowness without
            # masking a genuine hang — a healthy cmd/pinch run is well
            # under a minute; only the loaded-runner tail needs the
            # slack. Cheap packages are unaffected (per-package).
            test-flags: -timeout 600s -p 2

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # `go test` runs `go vet` automatically (with a slightly narrower
      # default check set than `go vet ./...`). We don't pass -vet=off,
      # so the standalone vet step would just re-run the same analysers
      # — pure duplication, ~10-30s on Windows. If you want stricter
      # vet coverage, pass -vet=all to `go test` instead.
      - name: Test
        if: matrix.coverage == false
        run: go test ${{ matrix.packages }} ${{ matrix.test-flags }}

      # Subprocess-coverage instrumentation (#185): tests in cmd/pinch
      # build pincher binaries on the fly and exec them via exec.Cmd to
      # exercise runXxxCLI dispatch wrappers. The `buildPincherBinary`
      # helper checks `os.Getenv("GOCOVERDIR")` — when set, it builds
      # the binary with `-cover -coverpkg=./...` so subprocesses emit
      # raw counter files. Go's test runner internally reassigns
      # GOCOVERDIR per-test and folds those subprocess counters into
      # the textfmt coverprofile automatically — no explicit
      # `covdata textfmt` step needed.
      #
      # Without this env var the helper skips `-cover` (avoids ~3x
      # build-time penalty during local `go test` runs) and the
      # dispatch wrappers stay at 0% — hence the prior 82% gate.
      - name: Test with coverage
        if: matrix.coverage == true
        env:
          GOCOVERDIR: covdata
        run: |
          mkdir -p covdata
          go test ${{ matrix.packages }} ${{ matrix.test-flags }} -coverprofile=cover.out
          # Exclude vendored third-party code from the coverage gate. The
          # subprocess -coverpkg=./... instrumentation folds every package
          # (including internal/tsbridge, the vendored wazero<->tree-sitter
          # binding) into cover.out; we don't gate coverage on upstream glue.
          # The binding's own correctness is covered by its dedicated test
          # suite (differential + fuzz, #1957), not the line-coverage gate.
          grep -v '/internal/tsbridge/' cover.out > cover.filtered.out
          go tool cover -func=cover.filtered.out | awk '/^total/ { gsub("%", "", $3); print $3 }' > coverage-total.txt

      - name: Upload coverage profile
        if: matrix.coverage == true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu
          path: |
            cover.out
            coverage-total.txt
          retention-days: 7

      - name: Build
        if: matrix.build_pinch
        run: go build ./cmd/pinch/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download coverage profile
        uses: actions/download-artifact@v8
        with:
          name: coverage-ubuntu

      # The Ubuntu test shard writes coverage-total.txt while Go is
      # already installed and the checkout is present. This job keeps
      # the branch-protection-visible "Coverage" check name without
      # paying for a second checkout + setup-go cycle just to run
      # `go tool cover` over an already-produced profile.
      #
      # Coverage gate progression: 83% (v0.5.0 dip) → 84% (v0.6.0 #200,
      # #215, #216, #218 — subprocess-coverage tests for the runXxxCLI
      # dispatch paths) → 85% (v0.7.0 #221 — split downloadAndSwap into
      # an inner downloadAndInstallAt that's exercised against
      # httptest.Server, plus a goInstallRunner indirection so the
      # `go install` exec call can be unit-tested without shelling out).
      #
      # Local Linux measures 85.2% post-#221. The 0.2pt headroom over
      # the 85.0 floor leaves margin for OS-specific branches that
      # don't fire on Linux (the Windows .exe.old move-aside path in
      # downloadAndInstallAt) so this gate doesn't become flaky on
      # the macOS / windows runners — those report at the same
      # number ±0.1 typically because the tests themselves cover
      # those branches via runtime.GOOS guards.
      - name: Check coverage threshold (85%)
        run: |
          TOTAL=$(tr -d '[:space:]' < coverage-total.txt)
          echo "Total coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 85) { print "Coverage " t "% is below 85% threshold"; exit 1 } }'

  # corpus-snapshot exercises the Makefile-driven snapshot pipeline (#33).
  # The Go-test gate (TestCorpusSnapshot_* in cmd/pinch/snapshot_test.go)
  # already covers the same diff logic, but this job additionally proves
  # the make + jq pipeline stays runnable — catches Makefile breakage and
  # missing dependencies that the Go tests would silently miss.
  #
  # ubuntu-only: jq isn't available by default on the Windows runner, and
  # the Go-side test gate covers cross-platform behaviour anyway.
  corpus-snapshot:
    name: Corpus snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify pinned-corpus snapshots
        run: make corpus-test

  # #642: validate the release-channel detection rule. Tiny shell test
  # exercises the modulo-10 rule + pre-release suffixes so a future
  # workflow edit can't silently break the dev/stable promotion pattern.
  release-channel:
    name: Shell script contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify channel detection
        run: |
          bash scripts/release-channel_test.sh
          bash scripts/swap-active-binary_test.sh

  # #690: workflow-isolation lint (#681 follow-up). Catches the recurring
  # "missing-checkout before script ref" bug shape that bit v0.54.0-beta.1
  # at tag time. cmd/workflow-lint walks every job in .github/workflows/,
  # flags any `run:` block referencing repo-local scripts (bash scripts/,
  # ./scripts/, make <target>, go run ./...) without an earlier
  # actions/checkout@vN step in the same job.
  #
  # Pre-tag-time gate: workflow bugs of this shape only fire when a real
  # tag pushes; this job catches them at PR-merge time instead.
  workflow-lint:
    name: Workflow isolation lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run workflow-lint
        run: go run ./cmd/workflow-lint

  # bench-smoke runs the #50 benchmark harness at a small benchtime to
  # prove benchmarks stay COMPILABLE and don't crash. Always required.
  bench-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run benchmarks (smoke only — 100ms per benchmark)
        run: |
          go test ./internal/index/ -run=^$ -bench=. -benchtime=100ms -benchmem
          go test ./internal/server/ -run=^$ -bench=. -benchtime=100ms -benchmem

  # Full race detector moved to .github/workflows/race-detector.yml
  # (#1895). It remains available on schedule/manual dispatch, but no
  # longer holds CI/release status open after required tests have passed.

  # bench-regression removed in v0.55 (#681 Bucket B). The job ran with
  # continue-on-error: true and failed on most PRs (variance on shared
  # runners). Always-red advisory check polluted the per-PR check view
  # without ever blocking, so reviewers learned to ignore it — the
  # signal-to-noise ratio went to zero.
  #
  # Decision matrix:
  #   - PROMOTE TO REQUIRED → needs N≥20 variance dataset across multiple
  #     weeks (per project memory `feedback_bench_gate_promotion.md`),
  #     plus ongoing maintenance to keep BENCH_EXCLUDE current. Months
  #     since the gate was created; the dataset never got captured.
  #   - REMOVE → -1 always-red CI line per PR; lose perf-watching value
  #     (already advisory anyway). Compile-test of new bench code is
  #     covered by `bench-smoke` (above), which runs at 100ms/bench and
  #     IS required.
  #   - MOVE TO SCHEDULED → run weekly via cron, post to dashboard.
  #     Defers the cleanup to a future PR (worth filing as #681 phase 2
  #     follow-up if perf-watching value is missed).
  #
  # Chose REMOVE. `make corpus-bench` + `cmd/benchcmp` survive for local
  # use when a contributor wants to validate a perf-sensitive change
  # before pushing. Baselines under `testdata/bench/` stay committed for
  # local comparison and as a re-promotion starting point if we ever
  # capture the variance dataset.

  # #681 Bucket C: PRs touching code must add a CHANGELOG.d/<num>.<type>.md
  # stub (per CHANGELOG.d/README.md convention). Pure-doc PRs are exempt.
  # Pattern eliminates the merge-conflict cost of two concurrent PRs
  # editing CHANGELOG.md's [Unreleased] section — the recurring friction
  # that produced ~5 conflicts across the v0.53/v0.54 cycles.
  changelog-stub-check:
    name: CHANGELOG stub check
    runs-on: ubuntu-latest
    # Only meaningful on PRs (master pushes don't have a "vs base" diff).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full history to diff vs base

      - name: Verify CHANGELOG stub
        run: bash scripts/changelog-stub-check.sh "origin/${{ github.base_ref }}"

  # #1103: PR title's (#N) conventional-commit suffix and PR body's
  # `Closes #M` references must agree, otherwise the auto-close
  # mechanism may close an issue unrelated to the PR's actual fix.
  # Observed twice in 24h on this repo (#1075, #1094 closed by
  # unrelated PRs #1092, #1095). This gate catches the mismatch
  # before merge.
  pr-issue-consistency:
    name: PR title/body issue refs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Check PR title (#N) ↔ body Closes #M consistency
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/pr-issue-consistency.sh "$PR_TITLE" "$PR_BODY"
