name: Race detector

# Triggers:
#   - push to a `v*` tag — release gate. Every RC / stable tag pays the
#     ~20–25 min race-instrumented test bill before the artifacts are
#     trusted. Promoted from advisory-only in v1.1.0-rc.2 per Tier 1
#     test-coverage hardening; before that race only ran via the daily
#     cron and was not part of the release path.
#   - daily schedule — drift detection between releases. Catches races
#     introduced by non-release commits on routine master pushes that
#     don't pay the per-commit race bill.
#   - workflow_dispatch — manual trigger for ad-hoc verification on any
#     ref.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: go test -race ./internal/...
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: go test -race ./internal/...
        env:
          CGO_ENABLED: 1
        # Race instrumentation is expensive on SQLite-heavy packages.
        # The 1800s test timeout bounds a single internal-package shard's
        # cost; the workflow-level timeout-minutes: 35 above bounds the
        # whole job so it cannot sit in the runner pool indefinitely.
        run: go test -race ./internal/... -timeout 1800s
