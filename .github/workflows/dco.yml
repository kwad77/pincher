# DCO sign-off gate.
#
# Every commit in a PR must carry a `Signed-off-by: Name <email>` trailer.
# This is the Developer Certificate of Origin (DCO) — a lightweight
# alternative to a CLA. By signing off, contributors assert they have the
# right to submit the work under pincherMCP's MIT license per the DCO 1.1
# text at https://developercertificate.org.
#
# How to sign off:
#   git commit -s -m "your message"        # signs the trailer automatically
#   git commit --amend -s                  # if you forgot
#   git rebase -i HEAD~N --exec 'git commit --amend --no-edit -s' # bulk
#
# Configure git to sign every commit by default:
#   git config --global format.signoff true
#
# The check passes when every commit in the PR's diff vs the base branch
# has a `Signed-off-by:` trailer whose name + email shape parses cleanly.
# Merge commits and revert commits are exempted by the upstream action.
name: DCO

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco-check:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check Signed-off-by on every commit
        uses: tim-actions/get-pr-commits@v1.3.1
        id: get-pr-commits
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: tim-actions/dco@v1.1.0
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
