# orderflow runtime config (hand-maintained).
# NOTE: tuning defaults (retry limits, backoffs, batch sizes) are NOT here —
# they live in gen/defaults.gen.json, regenerated by configgen.
service:
  listen: ":8080"
  queue_path: /tmp/orderflow-queue.jsonl
notify:
  from: orders@acme.example
  smtp_host: smtp.acme.example
